<!doctype html><html><head><meta charset="utf-8"><title>Date picker headers</title>
<link rel="stylesheet" href="style.css"></head><body><h1 style="font-size:18px">Date picker headers</h1>
<div id="cal-0" class="cal"><button id="cal-0-prev" class="nav" aria-label="Previous month">‹</button><span id="cal-0-month" class="month">March 2026</span><button id="cal-0-next" class="nav" aria-label="Next month">›</button></div><br>
<div id="cal-1" class="cal"><button id="cal-1-prev" class="nav tiny" aria-label="Previous month">‹</button><span id="cal-1-month" class="month">April 2026</span><button id="cal-1-next" class="nav tiny" aria-label="Next month">›</button></div><br>
<div id="cal-2" class="cal"><button id="cal-2-prev" class="nav" aria-label="Previous month">‹</button><span id="cal-2-month" class="month">May 2026</span><button id="cal-2-next" class="nav" aria-label="Next month">›</button></div><br>
<div id="cal-3" class="cal"><button id="cal-3-prev" class="nav tiny" aria-label="Previous month">‹</button><span id="cal-3-month" class="month">June 2026</span><button id="cal-3-next" class="nav tiny" aria-label="Next month">›</button></div><br>
<div id="cal-4" class="cal"><button id="cal-4-prev" class="nav" aria-label="Previous month">‹</button><span id="cal-4-month" class="month">July 2026</span><button id="cal-4-next" class="nav" aria-label="Next month">›</button></div><br>
<div class="spacer"></div><script src="recorder.js"></script></body></html>
