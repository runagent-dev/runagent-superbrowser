<!doctype html><html><head><meta charset="utf-8"><title>Filter rows with expand controls</title>
<link rel="stylesheet" href="style.css"></head><body><h1 style="font-size:18px">Filter rows with expand controls</h1>
<div id="row-us" class="row"><span id="row-us-label" class="label">United States</span><button id="row-us-chev" class="chev" aria-expanded="false" data-toggle="row-us-panel" aria-label="Expand United States">▼</button></div><div id="row-us-panel" hidden>Options for United States: A, B, C</div>
<div id="row-price" class="row"><span id="row-price-label" class="label">Price range</span><button id="row-price-chev" class="chev"  data-toggle="row-price-panel" aria-label="Expand Price range">▼</button></div><div id="row-price-panel" hidden>Options for Price range: A, B, C</div>
<div id="row-brand" class="row"><span id="row-brand-label" class="label">Brand</span><button id="row-brand-chev" class="chev tiny"  data-toggle="row-brand-panel" aria-label="Expand Brand">▾</button></div><div id="row-brand-panel" hidden>Options for Brand: A, B, C</div>
<div id="row-rating" class="row"><button id="row-rating-chev" class="chev" aria-expanded="false" data-toggle="row-rating-panel" aria-label="Expand Customer rating">▼</button><span id="row-rating-label" class="label">Customer rating</span></div><div id="row-rating-panel" hidden>Options for Customer rating: A, B, C</div>
<div id="row-size" class="row"><span id="row-size-label" class="label">Screen size</span><button id="row-size-chev" class="chev" aria-haspopup="true" data-toggle="row-size-panel" aria-label="Expand Screen size">›</button></div><div id="row-size-panel" hidden>Options for Screen size: A, B, C</div>
<div id="row-help" class="link-row"><a id="row-help-link" href="#help">Help center</a><span id="row-help-deco" class="deco">›</span></div>
<div class="spacer"></div><script src="recorder.js"></script></body></html>
