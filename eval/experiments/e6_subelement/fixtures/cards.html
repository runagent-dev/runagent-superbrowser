<!doctype html><html><head><meta charset="utf-8"><title>Listing cards with small actions</title>
<link rel="stylesheet" href="style.css"></head><body><h1 style="font-size:18px">Listing cards with small actions</h1>
<div id="card-0" class="card"><h3 id="card-0-title">Toyota Corolla 2019</h3><div class="meta">$18,500 · 42,000 mi</div><button id="card-0-act" class="act" aria-label="Save Toyota Corolla 2019">♡</button></div>
<div id="card-1" class="card"><h3 id="card-1-title">Honda Civic 2020</h3><div class="meta">$18,500 · 42,000 mi</div><button id="card-1-act" class="act tiny" aria-label="Compare Honda Civic 2020">♡</button></div>
<div id="card-2" class="card"><h3 id="card-2-title">Mazda 3 2018</h3><div class="meta">$18,500 · 42,000 mi</div><button id="card-2-act" class="act" aria-label="Save Mazda 3 2018">♡</button></div>
<div id="card-3" class="card"><h3 id="card-3-title">Kia Forte 2021</h3><div class="meta">$18,500 · 42,000 mi</div><button id="card-3-act" class="act tiny" aria-label="Hide Kia Forte 2021">♡</button></div>
<div id="card-4" class="card"><h3 id="card-4-title">Ford Focus 2017</h3><div class="meta">$18,500 · 42,000 mi</div><button id="card-4-act" class="act" aria-label="Save Ford Focus 2017">♡</button></div>
<a id="card-link" class="card" href="#detail" style="display:block;text-decoration:none;color:inherit"><h3 id="card-link-title">Subaru Impreza 2019</h3><div class="meta">$17,900 · 30,000 mi</div><span id="card-link-deco" class="deco" style="position:absolute;right:10px;top:10px">→</span></a>
<div class="spacer"></div><script src="recorder.js"></script></body></html>
