<!doctype html><html><head><meta charset="utf-8"><title>Checkbox rows</title>
<link rel="stylesheet" href="style.css"></head><body><h1 style="font-size:18px">Checkbox rows</h1>
<label id="chk-0" class="checkrow"><span id="chk-0-text">Free shipping</span><input id="chk-0-box" type="checkbox"></label>
<label id="chk-1" class="checkrow"><span id="chk-1-text">In stock only</span><input id="chk-1-box" type="checkbox"></label>
<label id="chk-2" class="checkrow"><span id="chk-2-text">Open-box</span><input id="chk-2-box" type="checkbox"></label>
<label id="chk-3" class="checkrow"><span id="chk-3-text">4 stars & up</span><input id="chk-3-box" type="checkbox"></label>
<label id="chk-4" class="checkrow"><span id="chk-4-text">Same-day pickup</span><input id="chk-4-box" type="checkbox"></label>
<div id="chk-plain" class="checkrow" style="display:flex;justify-content:space-between;width:420px;border:1px solid #ddd;padding:10px 12px"><span id="chk-plain-text">Include refurbished</span><input id="chk-plain-box" type="checkbox"></div>
<div class="spacer"></div><script src="recorder.js"></script></body></html>
